<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | GateCrash</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- GateCrash: phone setup (added by Board Game > Create Phone Web Template) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GateCrash">
    <meta name="theme-color" content="#05060f">
    <link rel="apple-touch-icon" href="TemplateData/icons/icon-180.png">
    <style>
      html, body {
        background: #05060f !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-container {
        position: fixed !important;
        left: env(safe-area-inset-left, 0px) !important;
        right: env(safe-area-inset-right, 0px) !important;
        top: env(safe-area-inset-top, 0px) !important;
        bottom: 0 !important;
        width: auto !important;
        height: auto !important;
        transform: none !important;
        margin: 0 !important;
        background: #05060f !important;
      }
      #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        background: #05060f !important;
        touch-action: none;
      }
      /* Soft fades along the top and bottom edges, so the game never ends in a hard line. */
      .gc-fade { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 2; }
      .gc-fade-top { top: 0; height: 24px; background: linear-gradient(#05060f, rgba(5,6,15,0)); }
      .gc-fade-bottom { bottom: 0; height: 16px; background: linear-gradient(rgba(5,6,15,0), #05060f); }
      #unity-footer, #unity-fullscreen-button, #unity-build-title, #unity-logo-title-footer { display: none !important; }
    </style>
</head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "GateCrash",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
      <!-- GateCrash: phone fit (added by Board Game > Create Phone Web Template) -->
    <script>
      (function () {
        // Draw at no more than 2x resolution: iPhones are 3x, which costs a lot of speed for little visible gain.
        if (typeof config !== "undefined") config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        var container = document.getElementById("unity-container");
        var probe = document.createElement("div");
        probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";
        document.body.appendChild(probe);

        ["top", "bottom"].forEach(function (edge) {
          var fade = document.createElement("div");
          fade.className = "gc-fade gc-fade-" + edge;
          container.appendChild(fade);
        });

        // Fill from just below the status bar to the very bottom of the screen. iPhone home-screen
        // apps can report a height that stops short of the bottom, so use the screen's real height there.
        function fit() {
          var top = parseFloat(getComputedStyle(probe).paddingTop) || 0;
          var full = window.innerHeight;
          var standalone = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
          if (standalone && window.innerWidth < window.innerHeight) full = Math.max(full, screen.height);
          container.style.setProperty("top", top + "px", "important");
          container.style.setProperty("bottom", "auto", "important");
          container.style.setProperty("height", (full - top) + "px", "important");
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
      })();
    </script>
  </body>
</html>
